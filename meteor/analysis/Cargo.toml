[package]
name = "meteor-analysis"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rustfft = "6.4"
anyhow = { version = "1", optional = true }
hdf5 = { package = "hdf5-metno", version = "0.12", optional = true }
rustplotlib = { git = "https://github.com/jvierine/rustplotlib.git", rev = "96e8aaa", optional = true }

[features]
plotting = ["dep:anyhow", "dep:hdf5", "dep:rustplotlib"]

[[bin]]
name = "meteor-plot"
path = "src/bin/plot.rs"
required-features = ["plotting"]
