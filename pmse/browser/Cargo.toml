[package]
name = "pansy-browser-imaging"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pansy-pmse-dsp = { path = "../processor" }
num-complex = "0.4"
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
opt-level = 3
