[package]
name = "pansy-legacy-capon"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Build on Revontuli without depending on the station's glibc/HDF5 versions.
portable = ["hdf5/static", "hdf5/zlib"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hdf5 = { package = "hdf5-metno", version = "=0.12.6" }
ndarray = "0.17"
num-complex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1

