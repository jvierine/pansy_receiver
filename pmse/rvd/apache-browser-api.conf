# Same-origin API running locally on juha.no against its local HDF5 archive.
# No SSH forwarding or connections into Revontuli.
ProxyPass /rvd/api/ http://127.0.0.1:18769/ connectiontimeout=5 timeout=45
ProxyPassReverse /rvd/api/ http://127.0.0.1:18769/
<Location /rvd/api/>
    Header always set Cache-Control "no-store"
</Location>
<LocationMatch "^/rvd/.*\.(js|wasm|html)$|^/rvd/$">
    Header always set Cache-Control "no-cache, must-revalidate"
</LocationMatch>

# JSON metadata is highly compressible; avoid transferring a full day's
# sparse-cell index uncompressed on every initial visit.
<Location /rvd/>
    AddOutputFilterByType DEFLATE application/json application/javascript text/javascript text/html text/css image/svg+xml
</Location>
