# Same-origin API; both ends of the SSH transport bind to loopback only.
ProxyPass /rvd/api/ http://127.0.0.1:18769/ connectiontimeout=5 timeout=45
ProxyPassReverse /rvd/api/ http://127.0.0.1:18769/
<Location /rvd/api/>
    Header always set Cache-Control "no-store"
</Location>
<LocationMatch "^/rvd/.*\.(js|wasm|html)$|^/rvd/$">
    Header always set Cache-Control "no-cache, must-revalidate"
</LocationMatch>
