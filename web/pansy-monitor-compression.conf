# Only the receiver monitor; no proxying or processing on the web host.
<Location /pansy/>
    AddOutputFilterByType DEFLATE application/wasm application/json text/javascript application/javascript text/html text/css image/svg+xml
    Header always set Cache-Control "no-cache, must-revalidate"
</Location>
<LocationMatch "^/pansy/(pkg/releases|assets)/">
    Header always unset Cache-Control
    Header always set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
